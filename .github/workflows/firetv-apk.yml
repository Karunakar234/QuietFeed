# Builds the Fire TV app and publishes it at a fixed link the Downloader app can open:
# https://github.com/Karunakar234/QuietFeed/releases/download/firetv-latest/QuietFeed-FireTV.apk
name: Fire TV APK

on:
  push:
    branches: [fire-tv, main]
    paths:
      - "QuietFeedFireTV/**"
      - "QuietFeed/Filtering/**"
      - ".github/workflows/firetv-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firetv-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuietFeedFireTV
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk QuietFeed-FireTV.apk

      - name: Publish to the firetv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view firetv-latest >/dev/null 2>&1; then
            gh release create firetv-latest \
              --title "QuietFeed for Fire TV" \
              --notes "Latest Fire TV build. Install with the Downloader app using the link to QuietFeed-FireTV.apk." \
              --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload firetv-latest QuietFeed-FireTV.apk --clobber
